<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account | AfterKey</title>
<meta name="description" content="Create your AfterKey private space.">
<meta name="theme-color" content="#080808">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://spidercrawler.site/register">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
<a class="skip" href="#form">Skip to form</a>

<main class="auth">
  <span class="auth__vignette" aria-hidden="true"></span>

  <section class="card" aria-labelledby="title">
    <div class="card__head">
      <a class="brand" href="/" aria-label="AfterKey home">
        <svg class="brand__mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <g stroke="currentColor" stroke-width="5" stroke-linecap="butt">
            <line x1="10" y1="32" x2="54" y2="32"/>
            <line x1="32" y1="10" x2="32" y2="54"/>
            <line x1="16.44" y1="16.44" x2="47.56" y2="47.56"/>
            <line x1="47.56" y1="16.44" x2="16.44" y2="47.56"/>
          </g>
        </svg>
        <span>afterkey<span class="brand__dot">.</span></span>
      </a>
      <h1 id="title">Create your space</h1>
      <p class="card__sub">One address. One password. Nothing else asked for.</p>
    </div>

    <form id="form" novalidate autocomplete="on">
      <div class="field">
        <label for="email">Email address</label>
        <div class="control">
          <svg class="control__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.75" y="5" width="18.5" height="14" rx="2.4"/>
            <path d="M3.4 6.6 12 12.7l8.6-6.1"/>
          </svg>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
                 placeholder="you@example.com" required maxlength="254"
                 aria-describedby="msg" spellcheck="false">
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="control">
          <svg class="control__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4.2" y="10.4" width="15.6" height="10.2" rx="2.4"/>
            <path d="M7.9 10.4V7.7a4.1 4.1 0 0 1 8.2 0v2.7"/>
            <circle cx="12" cy="15.4" r="1.15" fill="currentColor" stroke="none"/>
          </svg>
          <input id="password" name="password" type="password" autocomplete="new-password"
                 placeholder="At least 10 characters" required minlength="10" maxlength="200"
                 aria-describedby="msg pw-hint">
          <button class="reveal-btn" type="button" data-reveal aria-label="Show password"
                  aria-pressed="false" aria-controls="password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.2 12S5.7 5.9 12 5.9 21.8 12 21.8 12 18.3 18.1 12 18.1 2.2 12 2.2 12Z"/>
              <circle cx="12" cy="12" r="3.05"/>
            </svg>
          </button>
        </div>
        <p class="hint" id="pw-hint">Stored as a slow one-way hash. Never sent anywhere else.</p>
      </div>

      <button class="btn btn--primary" type="submit" data-submit>
        <span data-label>Create account</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.5 12h14.2M13.3 5.9 19.4 12l-6.1 6.1"/>
        </svg>
      </button>

      <p class="form__msg" id="msg" role="status" aria-live="polite" data-msg></p>
    </form>

    <p class="card__foot">Already have a space? <a href="/login">Sign in</a></p>
  </section>

  <p class="legal">
    By creating an account you accept the <a href="/terms.html">terms</a> and the
    <a href="/privacy.html">privacy note</a>.
  </p>
</main>

<script type="module" src="/assets/auth.js" defer></script>
</body>
</html>
