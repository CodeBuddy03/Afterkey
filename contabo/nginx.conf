# AfterKey, spidercrawler.site
# Static pages on this host plus a loopback-only API.
#
# Rules that matter here:
#   * every policy header sits in the server block, and no location adds its
#     own add_header, so nginx inheritance never drops them;
#   * clean URLs are explicit: /login, /register, /reset, /contact, /app;
#   * an unknown path is a real 404, never a soft copy of the homepage;
#   * source, env, database and log paths are unreachable even if they land
#     inside the web root;
#   * the API answers on loopback only, rate limited, never cached;
#   * TLS handshakes for unknown hostnames are rejected outright.
#
# If the JSON-LD block in index.html changes, recompute its CSP hash:
#   sha256-EP7SIEnFv51beW+LEgpEECsk+YWP73ttARctjXFIlwI=

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spidercrawler.site www.spidercrawler.site;

    root /var/www/afterkey;
    index index.html;

    server_tokens off;
    autoindex off;
    charset utf-8;
    absolute_redirect off;

    # one canonical name, so links, cookies and search results never split
    if ($host = www.spidercrawler.site) { return 301 https://spidercrawler.site$request_uri; }

    access_log /var/log/nginx/afterkey.access.log;
    error_log  /var/log/nginx/afterkey.error.log warn;

    # room for a 5000-character vault note plus its JSON envelope; the API caps
    # the payload itself at 32 KB
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 20s;

    # transport and browser policy
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-EP7SIEnFv51beW+LEgpEECsk+YWP73ttARctjXFIlwI='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;

    # TLS protocols, ciphers and session cache come from the certbot include
    # at the bottom of this block, so they are set in exactly one place.

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/woff2;

    # never serve dotfiles, sources, secrets or leftovers
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(?:py|pyc|env|log|sqlite3?|db|bak|old|orig|swp|map|ini|conf|service|sh)$ { return 404; }
    location ~ ^/(?:server|data|logs|bin|releases|shared|staging|archive)(?:/|$) { return 404; }
    location ~ ^/(?:docs|redoc|openapi\.json)(?:/|$) { return 404; }

    # API: loopback only, rate limited, no caching
    location = /api { return 404; }

    location /api/ {
        limit_req  zone=afterkey_api burst=40 nodelay;
        limit_conn afterkey_conn 16;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              spidercrawler.site;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        client_max_body_size 9m;
        client_body_buffer_size 16k;
        expires off;
    }

    # clean URLs for the real pages
    location = /login     { try_files /login.html     =404; }
    location = /register  { try_files /register.html  =404; }
    location = /reset     { try_files /reset.html     =404; }
    location = /contact   { try_files /contact.html   =404; }
    location = /app       { try_files /dashboard.html =404; }
    location ~ ^/app/(vault|settings|legacy|recovery|family|reviews)$ { try_files /dashboard.html =404; }
    location = /recover { try_files /recover.html =404; }
    location = /dashboard { return 301 /app; }
    # the link a recipient gets in the handoff email
    location = /release   { try_files /release.html =404; }
    # the link a named heir gets: the whole vault, read only
    location = /legacy    { try_files /legacy.html  =404; }

    # static
    location = /favicon.ico {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1h;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        expires 1h;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        expires 1h;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /404.html {
        internal;
        expires -1;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    ssl_certificate /etc/letsencrypt/live/spidercrawler.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/spidercrawler.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name spidercrawler.site www.spidercrawler.site;

    server_tokens off;
    charset utf-8;

    location /.well-known/acme-challenge/ { root /var/www/afterkey; }

    if ($host = www.spidercrawler.site) { return 301 https://$host$request_uri; }
    if ($host = spidercrawler.site)      { return 301 https://spidercrawler.site$request_uri; }
    return 404;
}

# Anything arriving on plain HTTP for another name is dropped without a reply.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}
